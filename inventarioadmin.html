<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inventario</title>
    <link rel="stylesheet" href="./admincss/inventarioadmin.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header>
        <div class="logo">

            <p>ELCTRONIC PRIX.</p>
        </div>
        <nav>
              <a href="./inicioadmin.html">
                 <i class="fa-solid fa-house"></i>
                Inicio
            </a>
            <a href="./inventarioadmin.html">
                <i class="fa-solid fa-boxes-stacked"></i>
                Inventario
                <a href="./proveedoresadmin.html">
                    <i class="fa-solid fa-truck"></i>
                    Proveedores
                </a>
                <a href="./reporteadmin.html">
                    <i class="fa-solid fa-chart-pie"></i>
                    Reportes
                </a>
                <a href="./cajaadmin.html">
                    <i class="fa-solid fa-cash-register"></i>
                    Caja
                </a>
                <a href="./usuarioadmin.html">
                    <i class="fa-solid fa-users"></i>
                    Gestión de Usuarios
                </a>

        </nav>
    </header>

    <main>
        <h1>Inventario</h1>

        <div class="inventario">

            <section class="inventorio-form">
                <section class="inventorio-form">
                    <form id="producto-form">
                        <div class="campos">
                            <input type="text" id="producto-id" placeholder="ponga el ID del producto" required>
                            <input type="text" id="producto-nombre" placeholder="Nombre del producto" required>
                        </div>
                        <div class="campos">
                            <input type="number" id="producto-stock" placeholder="agrega aqui el Stock" min="0"
                                required>
                            <input type="number" id="producto-precio" placeholder="Introduzca el Precio" min="0"
                                step="0.01" required>
                        </div>
                        <div class="campos">
                            <input type="text" id="producto-categoria" placeholder="Introduzca la Categoría" required>
                            <button type="submit">Agregar / Actualizar</button>
                        </div>
                    </form>
                </section>
            </section>

            <section class="stock-alerta">
                <section class="stock-alerta">
                    <h2>Productos con stock bajo</h2>
                    <ul id="alertas-inventario">
                        <!-- Alertas generadas automáticamente -->
                    </ul>
                </section>
            </section>

        </div>


        <section class="inventario-contenedor">
            <h2>Lista de Productos</h2>

            <div class="acciones-inventario">
                <input type="text" id="buscarProducto" placeholder="Buscar producto por nombre o ID...">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Stock</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="inventario-body">
                    <!-- Aquí se llenará el inventario dinámicamente -->
                </tbody>
            </table>
        </section>



    </main>

    <footer>
        <p>&copy; 2023 ELCTRONIC PRIX. Todos los derechos reservados.</p>
    </footer>

    <script src="./adminjs/inventarioadmin.js"></script>
</body>

</html>

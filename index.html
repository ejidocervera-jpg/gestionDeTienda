<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    
  <div class="contenedor">

        <div class="card-login">

            <h1>ELECTRONIC PRIX(gestion interna de la tienda)</h1>

            <p class="subtitulo">
                Bienvenido al Sistema de gestion de PRIX
            </p>

           <form id="myForm">

                <div class="grupo">

                    <label>Usuario</label>

                    <input type="text" placeholder="Ingrese su usuario" id="usuario">

                    <small>
                        Introduzca tu nombre de usuario.
                    </small>

                </div>

                <div class="grupo">

                    <label>Contraseña</label>

                    <input type="password" placeholder="Ingrese su contraseña" id="contraseña">

                    <small>
                        Escriba su contraseña de acceso.
                    </small>

                </div>

                <div class="enlaces">

                    <a href="#">
                        ¿Olvidó su contraseña? 
                    </a>

                </div>

           <button type="submit" class="btn-login" id="btnSubmit">
                    Iniciar Sesión
           </button>

            </form>


           

        </div>

    </div>



    <script src="./js/main.js"></script>
</body>
</html>
